<!-- Interactive State Management Script (Zero fluff toggles) -->
<script>
    const recordView = document.getElementById('recordView');
    const reviewView = document.getElementById('reviewView');
    const btnToReview = document.getElementById('btnToReview');
    const btnRecordAction = document.getElementById('btnRecordAction');
    const btnRedo = document.getElementById('btnRedo');
    const btnBackToRec = document.getElementById('btnBackToRec');
    const btnTogglePlay = document.getElementById('btnTogglePlay');
    const playIcon = document.getElementById('playIcon');

    function showReview() {
      recordView.classList.add('opacity-0', 'pointer-events-none');
      reviewView.classList.remove('opacity-0', 'pointer-events-none');
    }

    function showRecord() {
      reviewView.classList.add('opacity-0', 'pointer-events-none');
      recordView.classList.remove('opacity-0', 'pointer-events-none');
    }

    // Switch between record and review states
    btnToReview.addEventListener('click', showReview);
    btnRecordAction.addEventListener('click', showReview);
    btnRedo.addEventListener('click', showRecord);
    btnBackToRec.addEventListener('click', showRecord);

    // Minimal play / pause toggle
    let isPlaying = false;
    btnTogglePlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
    });
  </script>
