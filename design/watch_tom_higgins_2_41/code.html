<!-- Lightweight Inline Interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoCanvas = document.getElementById('videoCanvas');
      const indicator = document.getElementById('playbackStateIndicator');
      const playIcon = document.getElementById('playIcon');
      let isPlaying = true;

      // Tap on dispatch canvas toggles play/pause feedback
      videoCanvas.addEventListener('click', (e) => {
        // Prevent toggle if clicking on interactive controls
        if (e.target.closest('button') || e.target.closest('a')) return;

        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'play_arrow' : 'pause';
        
        indicator.classList.remove('opacity-0');
        indicator.classList.add('opacity-100');
        
        setTimeout(() => {
          indicator.classList.remove('opacity-100');
          indicator.classList.add('opacity-0');
        }, 550);
      });
    });
  </script>
